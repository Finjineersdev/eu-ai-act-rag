name: Answer evals
# Manual only, and only in a fork or copy with its own ANTHROPIC_API_KEY secret: it calls Claude.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to evaluate
        type: choice
        options: [claude-opus-5-5, claude-haiku-5-5]
        default: claude-opus-5-5

permissions:
  contents: read

jobs:
  answers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - run: uv sync --frozen
      - run: uv run python evals/run.py --answers
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ inputs.model }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: answer-eval-${{ inputs.model }}
          path: evals/results/

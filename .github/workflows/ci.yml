name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - name: Retrieval eval (no API key needed)
        run: uv run python evals/run.py --retrieval

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: docker build -t actrag .
      - name: Embedder loads offline and search works
        run: >
          docker run --rm --network none actrag /app/.venv/bin/python -c
          "from actrag.retrieve import Retriever; r = Retriever.load();
          assert r.search('biometric identification', k=1)"
      - run: docker run -d -p 8000:8000 --name actrag actrag
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do curl -fs localhost:8000/health && exit 0; sleep 2; done
          docker logs actrag; exit 1

  publish:
    # release tags only: the image the live demo (on Render) runs
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Build and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMAGE=ghcr.io/finjineersdev/eu-ai-act-rag
          docker build -t $IMAGE:${GITHUB_REF_NAME} .
          docker push $IMAGE:${GITHUB_REF_NAME}
          case "$GITHUB_REF_NAME" in *-*) ;; *)  # pre-releases (v1.2.0-rc1) don't move :latest
            docker tag $IMAGE:${GITHUB_REF_NAME} $IMAGE:latest && docker push $IMAGE:latest ;; esac

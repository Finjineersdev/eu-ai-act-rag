<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EU AI Act, cited</title>
<meta name="description" content="Ask the EU AI Act a question. Every citation is checked against the official text.">
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1b1d21; --muted: #5d636e; --line: #e3e4e8;
    --accent: #1f4fd1; --accent-ink: #ffffff; --ok: #14804a; --warn-bg: #fff6e0; --warn-ink: #7a5600;
    --quote: #f2f4f8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316; --panel: #191c20; --ink: #e9eaec; --muted: #9aa1ac; --line: #2a2e35;
      --accent: #7aa2ff; --accent-ink: #0d1020; --ok: #4fd18b; --warn-bg: #2b2410; --warn-ink: #f2cd6b;
      --quote: #20242a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
  header h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); }
  form { margin-top: 24px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; }
  textarea { width: 100%; min-height: 84px; resize: vertical; border: 0; outline: 0;
    background: transparent; color: var(--ink); font: inherit; }
  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: .85rem; }
  button { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); padding: 8px 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .6; cursor: progress; }
  button:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .examples button { font-size: .85rem; padding: 6px 10px; border-radius: 999px; color: var(--muted); }
  .thread { margin-top: 28px; display: grid; gap: 20px; }
  .turn { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .q { font-weight: 600; margin: 0 0 10px; }
  .answer { white-space: pre-wrap; margin: 0; }
  .answer sup a { text-decoration: none; color: var(--accent); font-weight: 600; padding: 0 1px; }
  .banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 10px 12px; margin: 0; }
  ol.cites { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  ol.cites li { border-top: 1px solid var(--line); padding-top: 10px; }
  .cite-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .num { color: var(--accent); font-weight: 700; }
  .ref { font-weight: 600; }
  .ok { color: var(--ok); font-size: .8rem; }
  blockquote { margin: 6px 0; padding: 8px 12px; background: var(--quote); border-radius: 6px; font-size: .92rem; }
  .cite-head a { margin-left: auto; font-size: .85rem; color: var(--accent); }
  footer { margin-top: 40px; color: var(--muted); font-size: .85rem; }
  .actions { margin-top: 12px; display: none; }
  @media (prefers-reduced-motion: no-preference) { .turn { animation: in .2s ease-out; } }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } }
</style>
</head>
<body>
<main>
  <header>
    <h1>EU AI Act, cited</h1>
    <p>Answers come only from the official text of Regulation (EU) 2024/1689. Every quote is checked against the source before it reaches you.</p>
  </header>

  <form id="form">
    <label for="q" class="hint">Your question</label>
    <textarea id="q" maxlength="2000" required placeholder="e.g. Does a customer-service chatbot have to say it's an AI?"></textarea>
    <div class="row">
      <span class="hint">Ctrl/⌘ + Enter to send</span>
      <button class="primary" id="send" type="submit">Ask</button>
    </div>
  </form>

  <div class="examples" id="examples" aria-label="Example questions">
    <button type="button">Which AI practices are prohibited?</button>
    <button type="button">When is an AI system high-risk?</button>
    <button type="button">What must deployers of high-risk AI systems do?</button>
    <button type="button">What are the fines for breaking the rules?</button>
  </div>

  <section class="thread" id="thread" aria-live="polite"></section>
  <div class="actions" id="actions"><button type="button" id="reset">Start a new topic</button></div>

  <footer>
    <span id="disclaimer">Research aid based on the text of Regulation (EU) 2024/1689. Not legal advice.</span>
    <span id="corpus"></span>
  </footer>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let history = [];  // last 4 turns, plain text only

  function el(tag, props = {}, ...kids) {
    const n = Object.assign(document.createElement(tag), props);
    n.append(...kids);
    return n;
  }

  function renderAnswer(text, id) {
    // turn " [n]" markers into links to the citation list; everything else stays plain text
    const p = el("p", { className: "answer" });
    for (const part of text.split(/(\s?\[\d+\])/)) {
      const m = part.match(/\[(\d+)\]/);
      if (m) p.append(el("sup", {}, el("a", { href: `#c-${id}-${m[1]}`, textContent: `[${m[1]}]` })));
      else p.append(part);
    }
    return p;
  }

  function renderTurn(question, data) {
    const id = Math.random().toString(36).slice(2, 8);
    const turn = el("article", { className: "turn" }, el("p", { className: "q", textContent: question }));
    if (data.error) {
      const msg = { truncated: "The answer was cut off before it finished, so it isn't shown. Try a narrower question.",
                    refused: "The model declined this request.",
                    no_api_key: "This server has no ANTHROPIC_API_KEY set, so it can't answer yet. Add one to .env and restart.",
                    upstream: "The model service is unavailable right now. Try again in a moment." }[data.error] || "Something went wrong. Try again.";
      turn.append(el("p", { className: "banner", textContent: msg }));
      return turn;
    }
    if (data.status !== "answered") turn.append(el("p", { className: "banner", textContent: data.answer }));
    else turn.append(renderAnswer(data.answer, id));
    if (data.citations?.length) {
      const ol = el("ol", { className: "cites" });
      data.citations.forEach((c, i) => {
        ol.append(el("li", { id: `c-${id}-${i + 1}` },
          el("div", { className: "cite-head" },
            el("span", { className: "num", textContent: `[${i + 1}]` }),
            el("span", { className: "ref", textContent: c.ref }),
            el("span", { className: "ok", textContent: "✓ quote found in source" }),
            el("a", { href: c.url, target: "_blank", rel: "noopener", textContent: "EUR-Lex ↗" })),
          el("blockquote", { textContent: c.quote })));
      });
      turn.append(ol);
    }
    return turn;
  }

  async function ask(question) {
    $("send").disabled = true; $("send").textContent = "Checking the text…";
    let data;
    try {
      const r = await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, history }) });
      data = await r.json();
      if (r.status === 422) data = { error: "invalid" };
    } catch { data = { error: "network" }; }
    $("send").disabled = false; $("send").textContent = "Ask";
    $("thread").append(renderTurn(question, data));
    $("actions").style.display = "block";
    if (data.corpus_date) $("corpus").textContent = ` · Text version ${data.corpus_date}.`;
    if (!data.error) history = [...history, { role: "user", content: question },
                                { role: "assistant", content: data.answer }].slice(-4);
    $("q").value = "";
  }

  $("form").addEventListener("submit", (e) => { e.preventDefault(); const q = $("q").value.trim(); if (q) ask(q); });
  $("q").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("form").requestSubmit(); });
  $("examples").addEventListener("click", (e) => { if (e.target.tagName === "BUTTON") ask(e.target.textContent); });
  $("reset").addEventListener("click", () => { history = []; $("thread").replaceChildren(); $("actions").style.display = "none"; });
  fetch("/health").then((r) => r.json()).then((h) => { $("corpus").textContent = ` · Text version ${h.corpus_date}.`; }).catch(() => {});
</script>
</body>
</html>

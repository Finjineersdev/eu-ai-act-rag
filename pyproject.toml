[project]
name = "actrag"
version = "1.1.2"
description = "Ask the EU AI Act questions; every citation is checked against the official text."
readme = "README.md"
authors = [{ name = "Haseeb Hanif" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[project]
name = "actrag"
version = "1.3.0"
description = "Ask the EU AI Act questions; every citation is checked against the official text."
readme = "README.md"
authors = [{ name = "Haseeb Hanif" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=2.12.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.54.0",
]


[project.urls]
Repository = "https://github.com/Finjineersdev/eu-ai-act-rag"
Demo = "https://eu-ai-act-rag-v1-2-1.onrender.com"
[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pyflakes/pycodestyle, imports, bugbear, pyupgrade, simplify, and bandit's security rules
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest checks
"evals/**" = ["S101"]
